name: Native macOS Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.5
      - name: Test speech ranges and floating panel layout
        run: mise run test
      - name: Build the AppKit app
        run: mise run build
      - name: Archive the app preserving permissions
        run: ditto -c -k --sequesterRsrc --keepParent build/native/Spokn.app build/native/Spokn.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Spokn-macOS
          path: build/native/Spokn.zip
